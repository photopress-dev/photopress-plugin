name: Deploy to WordPress.org
on:
  release:
    types: [published]
jobs:
  tag:
    name: New release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Composer (php-actions)
      uses: php-actions/composer@v1
    
    # Node 12 is PINNED DELIBERATELY -- do not "modernise" it.
    # Two hard blockers, both reproduced 2026-08-01:
    #   webpack 3.12    -> ERR_OSSL_EVP_UNSUPPORTED on Node >= 17 (OpenSSL 3)
    #   node-sass 4.14.1 -> ships no binary above ABI 83 (Node 14); the vendored
    #                       one here is linux-x64-72, i.e. Node 12
    # Moving off 12 requires replacing node-sass with dart-sass and upgrading
    # webpack first.
    - uses: actions/setup-node@v4
      with:
        node-version: '12'
    - name: Build
      run: |
        npm install
        npm run build
    - name: WordPress Plugin Deploy
      id: deploy
      uses: 10up/action-wordpress-plugin-deploy@stable
      with:
        generate-zip: true
      env:
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SLUG: photopress
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ${{github.workspace}}/${{ github.event.repository.name }}.zip
        asset_name: ${{ github.event.repository.name }}.zip
        asset_content_type: application/zip
