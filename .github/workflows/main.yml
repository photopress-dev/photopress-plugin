name: Deploy to WordPress.org
on:
  release:
    types: [published]
  # Manual trigger for validating the release pipeline without shipping.
  # This workflow only fires on `release: published`, so before this existed the
  # first test of any change to it WAS a live deploy to WordPress.org. With
  # dry-run the 10up action performs every step except the final Subversion
  # commit, and does not require the SVN secrets.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Skip the WordPress.org SVN commit (leave true to test safely)'
        type: boolean
        default: true
permissions:
  contents: write

jobs:
  tag:
    name: New release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    # WordPress.org takes the version from the tag; the plugin from the Version
    # header in photopress.php (PHOTOPRESS_CORE_VERSION is read from it); the
    # plugin directory from README.txt's Stable tag. A release where they differ
    # stops here. A manual dispatch has no tag and checks the other two.
    - name: Check the version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        header=$(sed -n 's/^Version:[[:space:]]*//p' photopress.php | tr -d '\r[:space:]')
        stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' README.txt | tr -d '\r[:space:]')
        expected=${TAG:-$header}
        echo "tag: ${TAG:-none}  Version header: $header  Stable tag: $stable"
        if [ -z "$header" ] || [ "$header" != "$expected" ] || [ "$stable" != "$expected" ]; then
          echo "::error::The release tag, the Version header in photopress.php and the Stable tag in README.txt must be the same."
          exit 1
        fi
    # v1 dates from 2021. Composer is still needed even though there are no
    # runtime dependencies left: composer.json's autoload block (psr-4 plus a
    # classmap over framework/) is what makes pp_api and the rest of the
    # framework loadable at all.
    - name: Composer (php-actions)
      uses: php-actions/composer@v6
      with:
        # PHPUnit, Brain Monkey and WordPress core are for tests only.
        dev: no
    
    # Matches the engines field in package.json; @wordpress/scripts needs 22 or 24.
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
    - name: Build
      run: |
        npm ci
        npm run build
    - name: WordPress Plugin Deploy
      id: deploy
      uses: 10up/action-wordpress-plugin-deploy@stable
      with:
        generate-zip: true
        # Only ever true for a manual dispatch. On `release: published` the input
        # is unset, so this renders empty -> false, and the deploy is real.
        dry-run: ${{ inputs.dry-run || false }}
      env:
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SLUG: photopress
        # The action derives VERSION from the tag: `VERSION="${GITHUB_REF#refs/tags/}"`,
        # but only when VERSION is empty. A manual dispatch has no tag -- GITHUB_REF is
        # refs/heads/master -- so it tried to create an SVN tag called "refs/heads" and
        # died with `svn: E155010 ... is not a directory`. Supplying a placeholder only
        # for dispatch keeps the dry run self-contained; on a real release this is empty
        # and the tag is used as before.
        VERSION: ${{ github.event_name == 'workflow_dispatch' && '0.0.0-dryrun' || '' }}
    # actions/upload-release-asset was archived by GitHub in 2021.
    #
    # Takes the path from the deploy step's own output rather than guessing the
    # filename. The old version hardcoded "<repository.name>.zip", i.e.
    # photopress-plugin.zip, but the zip is named after SLUG -- photopress.zip --
    # so the asset upload was pointing at a file that never existed.
    # Skipped on workflow_dispatch: there is no release to attach an asset to.
    - name: Upload release asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ steps.deploy.outputs.zip-path }}
